<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
  <title id="title">Scheduling window propagation</title>
  <desc id="description">The backward pass removes late first-trip departures that cannot leave enough time for the second trip. The forward pass removes early second-trip departures after the first arrival is known.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
    <pattern id="excluded" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 2L2-2M0 8L8 0M6 10L10 6" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <g fill="currentColor">
    <text x="20" y="30" font-weight="bold">Backward pass: tighten latest departures</text>
    <text x="20" y="315" font-weight="bold">Forward pass: tighten earliest departures and choose times</text>
    <text x="35" y="112">Trip 1</text>
    <text x="35" y="177">Trip 2</text>
    <text x="35" y="387">Trip 1</text>
    <text x="35" y="462">Trip 2</text>

    <text x="150" y="88">reported [0, 100]</text>
    <text x="600" y="88">latest feasible: 90</text>
    <text x="600" y="198">reported [90, 120]</text>
    <text x="735" y="145" text-anchor="middle">20 s travel + 10 s activity</text>

    <text x="550" y="360" text-anchor="middle">depart 80</text>
    <text x="650" y="360" text-anchor="middle">arrive 100</text>
    <text x="675" y="440" text-anchor="middle">reported [90, 120] → feasible [110, 120]</text>
    <text x="725" y="490" text-anchor="middle">depart 115</text>
    <text x="825" y="490" text-anchor="middle">arrive 135</text>
    <text x="720" y="415" text-anchor="middle">10 s activity sets the next earliest departure</text>
  </g>

  <g fill="none" stroke="currentColor">
    <path d="M150 105H650" stroke-opacity="0.3" stroke-width="6"/>
    <path d="M150 105H600" stroke-width="6"/>
    <rect x="600" y="96" width="50" height="18" fill="url(#excluded)"/>
    <path d="M600 170H750" stroke-width="6"/>
    <path d="M750 163C735 125 665 112 604 104" marker-end="url(#arrow)"/>

    <path d="M150 380H600" stroke-width="6"/>
    <circle cx="550" cy="380" r="6" fill="currentColor"/>
    <circle cx="650" cy="380" r="7"/>
    <path d="M558 380H641" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <path d="M600 455H750" stroke-opacity="0.3" stroke-width="6"/>
    <rect x="600" y="446" width="100" height="18" fill="url(#excluded)"/>
    <path d="M700 455H750" stroke-width="6"/>
    <circle cx="725" cy="455" r="6" fill="currentColor"/>
    <circle cx="825" cy="455" r="7"/>
    <path d="M733 455H816" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <path d="M655 388C675 400 690 422 698 446" marker-end="url(#arrow)"/>

    <path d="M20 285H940" stroke-opacity="0.25"/>
    <path d="M150 220H850M150 525H850"/>
    <path d="M150 214V226M250 214V226M350 214V226M450 214V226M550 214V226M650 214V226M750 214V226M850 214V226"/>
    <path d="M150 519V531M250 519V531M350 519V531M450 519V531M550 519V531M650 519V531M750 519V531M850 519V531"/>
  </g>

  <g fill="currentColor" text-anchor="middle">
    <text x="150" y="242">0</text>
    <text x="250" y="242">20</text>
    <text x="350" y="242">40</text>
    <text x="450" y="242">60</text>
    <text x="550" y="242">80</text>
    <text x="650" y="242">100</text>
    <text x="750" y="242">120</text>
    <text x="850" y="242">140</text>
    <text x="500" y="263">Time from diary start (seconds)</text>

    <text x="150" y="547">0</text>
    <text x="250" y="547">20</text>
    <text x="350" y="547">40</text>
    <text x="450" y="547">60</text>
    <text x="550" y="547">80</text>
    <text x="650" y="547">100</text>
    <text x="750" y="547">120</text>
    <text x="850" y="547">140</text>
  </g>
</svg>
