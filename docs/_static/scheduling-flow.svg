<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" role="img" aria-labelledby="title description">
  <title id="title">This diagram shows the travel-diary scheduling flow.</title>
  <desc id="description">Validated diaries pass through reverse feasibility bounds and forward departure realization. Successful diaries form a scheduled dataset, while infeasible diaries produce diagnostics.</desc>
  <g fill="none" stroke="currentColor">
    <rect x="20" y="70" width="160" height="60" rx="4"/>
    <rect x="250" y="70" width="180" height="60" rx="4"/>
    <rect x="500" y="70" width="180" height="60" rx="4"/>
    <rect x="750" y="20" width="150" height="60" rx="4"/>
    <rect x="750" y="130" width="150" height="60" rx="4"/>
    <path d="M180 100H250M430 100H500M680 100H715V50H750M715 100V160H750"/>
    <path d="M240 94L250 100L240 106M490 94L500 100L490 106M740 44L750 50L740 56M740 154L750 160L740 166"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="14">
    <text x="100" y="94">
      <tspan x="100">The input contains</tspan>
      <tspan x="100" dy="22">validated diaries.</tspan>
    </text>
    <text x="340" y="94">
      <tspan x="340">The scheduler derives</tspan>
      <tspan x="340" dy="22">future bounds.</tspan>
    </text>
    <text x="590" y="94">
      <tspan x="590">The scheduler realizes</tspan>
      <tspan x="590" dy="22">departures.</tspan>
    </text>
    <text x="825" y="38">
      <tspan x="825">Successful diaries</tspan>
      <tspan x="825" dy="17">form the scheduled</tspan>
      <tspan x="825" dy="17">dataset.</tspan>
    </text>
    <text x="825" y="148">
      <tspan x="825">Infeasible diaries</tspan>
      <tspan x="825" dy="17">produce structured</tspan>
      <tspan x="825" dy="17">diagnostics.</tspan>
    </text>
  </g>
</svg>
