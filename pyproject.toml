[project]
name = "athenspop"
version = "0.1.0"
description = "Long-form travel survey diary validation, scheduling, sequence analysis, and clustering."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dimitris Mantas", email = "dimitris.mantas@outlook.com" }
]
keywords = ["activity-travel", "clustering", "scheduling", "travel-survey"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
]

[project.urls]
Repository = "https://github.com/lotentua/athenspop"

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/athenspop"]

[dependency-groups]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.19.0",
    "sphinx>=9.1.0",
]
dev = [
    { include-group = "docs" },
    "matplotlib>=3.10.8",
    "pytest>=9.0.0",
    "ruff>=0.15.8",
    "ty>=0.0.50",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "examples/athens/tests"]
